[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evf-tts-service"
version = "3.2.0"
description = "Python TTS service for English Video Factory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "edge-tts>=7.2,<8",
  "python-dotenv>=1.1,<2",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
vieneu = ["vieneu"]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
evf-tts = "tts_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
