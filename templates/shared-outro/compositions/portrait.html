<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/><title>Shared Outro</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden}body{font-family:"Segoe UI","Noto Sans",Arial,sans-serif;background:#0b1220;color:#f8fafc}
:root{--bg:#0b1220;--surface:#111c31;--surface2:#17243d;--primary:#38bdf8;--secondary:#a78bfa;--accent:#facc15;--text:#f8fafc;--muted:#cbd5e1;--correct:#22c55e;--incorrect:#ef4444}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 90% 5%,#38bdf833,transparent 32%),radial-gradient(circle at 5% 92%,#a78bfa30,transparent 34%),linear-gradient(160deg,var(--bg),#0f1a2f 62%,var(--bg));color:var(--text)}

.shell{position:relative;z-index:2;height:100%;padding:96px 76px 78px;display:flex;flex-direction:column}.brandline{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:25px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.brandline b{color:var(--primary)}
