<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/><title>Vocabulary Examples</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden}body{font-family:"Segoe UI","Noto Sans",Arial,sans-serif;background:#0b1220;color:#f8fafc}
:root{--bg:#0b1220;--surface:#111c31;--surface2:#17243d;--primary:#38bdf8;--secondary:#a78bfa;--accent:#facc15;--text:#f8fafc;--muted:#cbd5e1;--correct:#22c55e;--incorrect:#ef4444}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 90% 5%,#38bdf833,transparent 32%),radial-gradient(circle at 5% 92%,#a78bfa30,transparent 34%),linear-gradient(160deg,var(--bg),#0f1a2f 62%,var(--bg));color:var(--text)}
#root:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:72px 72px;opacity:.45}
.shell{position:relative;z-index:2;height:100%;padding:96px 76px 78px;display:flex;flex-direction:column}.brandline{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:25px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.brandline b{color:var(--primary)}
.pill{display:inline-flex;align-items:center;align-self:flex-start;padding:13px 22px;border:2px solid #ffffff30;border-radius:999px;color:var(--accent);font-size:25px;font-weight:900;letter-spacing:3px;text-transform:uppercase;background:#ffffff08}
@keyframes rise{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:scale(1)}}@keyframes slide{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:translateX(0)}}
.top{display:flex;justify-content:space-between;align-items:center}.top .word{font-size:34px;font-weight:950;color:var(--primary)}.cards{margin-top:110px;display:grid;gap:34px}.card{position:relative;padding:36px 38px 34px 84px;border-radius:32px;background:linear-gradient(145deg,#ffffff12,#ffffff08);border:2px solid #ffffff20;opacity:0;transform:translateY(35px);animation:rise .58s forwards}.card:nth-child(1){animation-delay:.35s}.card:nth-child(2){animation-delay:1.35s}.card:nth-child(3){animation-delay:2.35s}.num{position:absolute;left:24px;top:36px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#111827;font-size:22px;font-weight:950}.en{font-size:39px;line-height:1.36;font-weight:850}.en mark{background:var(--primary);color:#07111f;border-radius:8px;padding:0 .08em}.vi{font-size:31px;line-height:1.42;color:var(--muted);margin-top:18px}.explain{font-size:27px;line-height:1.42;color:#c4b5fd;margin-top:18px;padding-top:18px;border-top:1px solid #ffffff20}</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920" data-composition-variables='{"label":"VÍ DỤ THỰC TẾ","word":"resilient","examples":[{"sentenceEn":"She remained resilient after the failure.","meaningVi":"Cô ấy vẫn kiên cường sau thất bại.","explanationVi":"Dùng để nói về khả năng vượt qua khó khăn."},{"sentenceEn":"The local economy proved resilient.","meaningVi":"Nền kinh tế địa phương cho thấy khả năng phục hồi tốt.","explanationVi":"Có thể dùng cho hệ thống hoặc tổ chức."}],"brand":"English Mỗi Ngày"}'><div class="shell"><div class="top"><div class="pill label"></div><div class="word"></div></div><main class="cards"></main><div class="brandline"><b class="brand"></b><span>2–3 ví dụ trong ngữ cảnh</span></div></div></div><script>(function(){const v=window.__hyperframes?.getVariables?.()||{};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const set=(s,x)=>{const e=document.querySelector(s);if(e&&x!=null)e.textContent=String(x)};set('.label',v.label);set('.top .word',v.word);set('.brand',v.brand);const cards=document.querySelector('.cards');(Array.isArray(v.examples)?v.examples:[]).forEach((x,i)=>{const card=document.createElement('article');card.className='card';let en=esc(x.sentenceEn);const w=String(v.word||'');const at=String(x.sentenceEn||'').toLowerCase().indexOf(w.toLowerCase());if(w&&at>=0){const raw=String(x.sentenceEn);en=esc(raw.slice(0,at))+'<mark>'+esc(raw.slice(at,at+w.length))+'</mark>'+esc(raw.slice(at+w.length));}card.innerHTML='<div class="num">'+(i+1)+'</div><div class="en">'+en+'</div><div class="vi">'+esc(x.meaningVi)+'</div>'+(x.explanationVi?'<div class="explain">'+esc(x.explanationVi)+'</div>':'');cards.appendChild(card)});})();</script><script>window.__timelines=window.__timelines||{};window.__timelines.main={pause:function(){},seek:function(){},paused:function(){return true;}};</script></body></html>
