<!doctype html><html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/><title>Channel Outro</title><style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:1080px;height:1920px;overflow:hidden}body{font-family:"Segoe UI","Noto Sans",Arial,sans-serif;background:#0b1220;color:#f8fafc}
:root{--bg:#0b1220;--primary:#38bdf8;--secondary:#a78bfa;--accent:#facc15;--text:#f8fafc;--muted:#cbd5e1}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(circle at 50% 22%,#38bdf845,transparent 32%),radial-gradient(circle at 12% 88%,#a78bfa36,transparent 36%),linear-gradient(160deg,#07101f,#0f1a2f 58%,#090f1c);color:var(--text)}
#root:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:72px 72px;opacity:.4}.glow{position:absolute;width:540px;height:540px;border-radius:50%;left:270px;top:260px;background:#38bdf827;filter:blur(90px)}
.shell{position:relative;z-index:2;height:100%;padding:120px 84px 92px;display:flex;flex-direction:column;align-items:center;text-align:center}.eyebrow{font-size:25px;font-weight:950;letter-spacing:5px;color:var(--accent);opacity:0;animation:rise .5s .15s forwards}.logo-wrap{position:relative;margin-top:190px;width:290px;height:290px;border-radius:78px;padding:14px;background:linear-gradient(145deg,#ffffff42,#ffffff0d);box-shadow:0 32px 95px #0008,0 0 74px #38bdf855;opacity:0;animation:logoPop .75s .38s cubic-bezier(.2,.9,.2,1.2) forwards}.logo-inner{width:100%;height:100%;border-radius:66px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#38bdf8,#7c3aed)}.logo-img{width:100%;height:100%;object-fit:cover;display:none}.logo-fallback{font-size:88px;line-height:1;font-weight:1000;letter-spacing:-4px;color:white;text-shadow:0 8px 24px #0005}.brand{margin-top:54px;font-size:58px;line-height:1.1;font-weight:1000;letter-spacing:-2px;opacity:0;animation:rise .55s .9s forwards}.cta{margin-top:78px;max-width:840px;padding:38px 42px;border-radius:32px;background:linear-gradient(135deg,#38bdf820,#a78bfa24);border:2px solid #ffffff25;font-size:43px;line-height:1.42;font-weight:850;opacity:0;animation:rise .6s 1.25s forwards}.actions{margin-top:54px;display:flex;gap:24px;opacity:0;animation:rise .55s 1.65s forwards}.action{display:flex;align-items:center;gap:13px;padding:17px 25px;border-radius:999px;background:#ffffff12;border:2px solid #ffffff20;font-size:27px;font-weight:900}.action.heart{color:#fda4af}.action.follow{color:var(--primary)}.handle{margin-top:auto;color:var(--muted);font-size:25px;font-weight:850;letter-spacing:2px;opacity:0;animation:rise .5s 1.95s forwards}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}@keyframes logoPop{from{opacity:0;transform:scale(.72) rotate(-5deg)}to{opacity:1;transform:scale(1) rotate(0)}}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920" data-composition-variables='{"brand":"English Mỗi Ngày","handle":"Theo dõi · Lưu · Ôn lại","cta":"Hãy follow kênh và thả tim để cập nhật thêm nhiều bài học mới nhé.","logoUrl":"","logoText":"EMN"}'><div class="glow"></div><div class="shell"><div class="eyebrow">HỌC MỖI NGÀY · GIỎI MỖI NGÀY</div><div class="logo-wrap"><div class="logo-inner"><img class="logo-img" alt="Channel logo"/><div class="logo-fallback"></div></div></div><div class="brand"></div><div class="cta"></div><div class="actions"><div class="action follow">＋ FOLLOW</div><div class="action heart">♥ THẢ TIM</div></div><div class="handle"></div></div></div><script>(function(){const v=window.__hyperframes?.getVariables?.()||{};const set=(s,x)=>{const e=document.querySelector(s);if(e&&x!=null)e.textContent=String(x)};set('.brand',v.brand);set('.cta',v.cta);set('.handle',v.handle);const fallback=document.querySelector('.logo-fallback');const img=document.querySelector('.logo-img');const initials=String(v.logoText||String(v.brand||'EN').split(/\s+/).map(x=>x[0]).join('').slice(0,4)).toUpperCase();if(fallback)fallback.textContent=initials;const url=String(v.logoUrl||'').trim();if(url&&img){img.onload=()=>{img.style.display='block';if(fallback)fallback.style.display='none'};img.onerror=()=>{img.style.display='none';if(fallback)fallback.style.display='block'};img.src=url}})();</script><script>window.__timelines=window.__timelines||{};window.__timelines.main={pause:function(){},seek:function(){},paused:function(){return true;}};</script></body></html>
